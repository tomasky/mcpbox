name: Release

# Tagging is the trigger: `git tag v0.1.1 && git push origin v0.1.1`.
# `workflow_dispatch` re-cuts a release without moving a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.1 (defaults to the ref name)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # One native build per target. MoonBit's native backend goes through the
  # system C compiler, so each target is built on its own runner rather than
  # cross-compiled.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically against musl so they
          # run on any distribution regardless of its glibc version. A glibc
          # build would bake in the runner's symbol versions and refuse to
          # start on older systems ("GLIBC_2.38 not found").
          #
          # The x86_64 build is pinned to Ubuntu 24.04 rather than
          # `ubuntu-latest`: newer Ubuntu images raise the compiler's default
          # target to x86-64-v3 (AVX2/BMI2), and their static musl libc.a is
          # built the same way. That produces a binary that dies with SIGILL
          # ("Illegal instruction") on pre-Haswell CPUs, so 24.04 keeps both
          # the project code and libc.a at the x86-64 baseline.
          - runner: ubuntu-24.04
            target: linux-x86_64
            musl: true
          # GitHub's arm64 Linux runners are only available to public
          # repositories. Remove this entry if that is a problem.
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            musl: true
          - runner: macos-15
            target: darwin-aarch64
            musl: false
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, moonbitlang/async, ...) cannot be resolved until the
      # index is fetched.
      - name: Update registry index
        run: moon update

      - name: Build (static, release)
        if: matrix.musl
        run: ./scripts/build-linux-static.sh "dist/mcpbox-${{ matrix.target }}"

      - name: Build (release)
        if: ${{ !matrix.musl }}
        run: |
          moon build --target native --release
          mkdir -p dist
          cp _build/native/release/build/cmd/mcpbox/mcpbox.exe "dist/mcpbox-${{ matrix.target }}"
          chmod 755 "dist/mcpbox-${{ matrix.target }}"

      # Only two assets per target: the binary and its checksum. Both the
      # npm launcher and install.sh fetch the bare asset and set the mode
      # themselves, so an archive would be a third thing to keep in sync and
      # nothing would read it. GitHub already offers "Source code (tar.gz)"
      # for anyone who wants an archive of the tag.
      - name: Stage assets
        run: |
          set -eu
          asset="mcpbox-${{ matrix.target }}"
          file "dist/$asset" || true
          # `shasum` exists on macOS and most Linux images; `sha256sum` is the
          # coreutils fallback. Check for the command rather than chaining with
          # `||`, which would also run the fallback when `shasum` merely failed.
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          else
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          fi
          ls -l dist

      - name: Smoke test
        run: |
          set -eu
          "./dist/mcpbox-${{ matrix.target }}" version
          "./dist/mcpbox-${{ matrix.target }}" help >/dev/null

      # Each target uploads its own assets to the one release for this tag.
      # Shipping the files straight from the runner that built them avoids
      # staging them as workflow artifacts and downloading them again in a
      # separate job; `action-gh-release` creates the release on first use and
      # appends to it afterwards, so the matrix fills the same release in
      # parallel.
      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/mcpbox-${{ matrix.target }}
            dist/mcpbox-${{ matrix.target }}.sha256

  # The npm package is a launcher, not a bundle: it downloads the matching
  # release asset on first run. Publishing after the release job guarantees the
  # asset exists before the first user pulls it.
  npm:
    name: publish @tomasko/mcpbox
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Same resolution the build jobs use, so a tag pushed as `v0.1.9` and a
      # `workflow_dispatch` with no tag both agree on the version being shipped.
      - name: Check the package version matches the release
        working-directory: npmjs
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            WANT="$INPUT_TAG"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            WANT="$GITHUB_REF_NAME"
          else
            WANT="v$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' ../moon.mod)"
          fi
          WANT="${WANT#v}"
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::npmjs/package.json is $HAVE but the release tag is $WANT"
            exit 1
          fi

      - name: Publish
        working-directory: npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping the npm publish."
            exit 0
          fi
          npm publish --access public --provenance
